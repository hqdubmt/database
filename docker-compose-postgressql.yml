version: '3.8'

services: # Khai báo dịch vụ một lần duy nhất ở đầu file

  # 1. DỊCH VỤ POSTGRESQL
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network # Chỉ ghi tên mạng ở đây, không khai báo driver ở đây

  # 2. DỊCH VỤ REDIS
  redis:
    image: redis:7
    container_name: redis
    restart: always
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # 3. DỊCH VỤ MONGO
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    env_file:
      - .env
    environment: # Sửa lỗi thụt lề cho các biến môi trường bên dưới
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ./mongo-entrypoint:/docker-entrypoint-initdb.d
      - mongo_data:/data/db
    networks:
      - app_network

# KHAI BÁO VOLUMES (Gom chung lại ở cuối file)
volumes:
  postgres_data:
  mongo_data:
  redis_data:

# KHAI BÁO NETWORKS (Khai báo duy nhất một lần ở cuối file)
networks:
  app_network:
    driver: bridge
